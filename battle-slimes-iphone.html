<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b9b5aa">
<title>Battle Slimes</title>
<style>
  :root { font: 16px Tahoma, system-ui, sans-serif; --ink: #171714; --paper: #b9b5aa; --stone: #d2cbbd; --lime: #a7fa36; --red: #fa522d; }
  * { box-sizing: border-box; }
  html { min-height: 100%; background: #242320; -webkit-text-size-adjust: 100%; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); color: var(--ink); background: radial-gradient(ellipse at 50% 20%, #504b43, #242320 74%); }
  .cabinet { width: min(100%, 510px, max(230px, calc((100svh - 120px) * .8))); border: 3px solid var(--ink); border-radius: 17px 20px 14px 18px; overflow: hidden; background: var(--paper); box-shadow: 0 14px 55px #0d0d0bb0, 0 0 0 1px #aaa394; }
  .stage { position: relative; aspect-ratio: 4 / 5; color: var(--ink); container-type: inline-size; isolation: isolate; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay { position: absolute; inset: 0; text-align: center; }
  h1, h2, p { margin: 0; }
  h1, h2, .action, .hud, .slot { font-family: 'Arial Black', Impact, system-ui, sans-serif; font-weight: 1000; }
  h1 { font-size: 18cqw; line-height: .88; letter-spacing: -.075em; transform: rotate(-6deg); color: #fff3d8; paint-order: stroke fill; -webkit-text-stroke: .09em var(--ink); text-shadow: .025em .095em var(--ink); }
  h1 span { display: block; color: var(--lime); }
  h2 { font-size: clamp(1.35rem, 8cqw, 2.45rem); line-height: 1.05; letter-spacing: -.06em; }
  .cover, .match { padding-top: 12%; }
  .match p, .modal p { margin-top: 9px; font-size: clamp(.76rem, 3.6cqw, .98rem); }
  .opponent { position: absolute; inset: auto 0 16%; font-weight: 900; font-size: 5.4cqw; }
  button { touch-action: manipulation; -webkit-appearance: none; appearance: none; font: inherit; }
  button:focus-visible { outline: 3px solid #292e1b; outline-offset: 3px; }
  .action, .slot, .gear { border: 3px solid var(--ink); border-radius: 11px 15px 9px 13px / 12px 10px 13px 8px; box-shadow: 0 3px var(--ink); color: var(--ink); cursor: pointer; }
  .action { min-height: 43px; padding: 5px 20px; background: var(--lime); font-size: clamp(.84rem, 4.45cqw, 1.25rem); letter-spacing: .025em; }
  .action:hover, .slot:not(:disabled):hover, .gear:hover { filter: brightness(1.1); }
  .action:active, .slot:not(:disabled):active, .gear:active { translate: 0 2px; box-shadow: 0 1px var(--ink); }
  .hud { position: absolute; inset: 3.5% 4% auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding-right: 47px; pointer-events: none; }
  .fighter { width: min(52%, 184px); min-width: 0; font-size: clamp(.67rem, 3.6cqw, 1rem); line-height: 1.1; }
  .plate { display: block; padding: 5px 7px; background: #dfd8ca; border: 3px solid var(--ink); border-radius: 7px 10px 7px 5px / 8px 6px 9px 6px; transform: rotate(-1.2deg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fighter-name { display: block; overflow: hidden; text-overflow: ellipsis; }
  .score { display: block; margin-top: 4px; font: 900 .67em/1.1 Tahoma, sans-serif; }
  .opponent .score { font-size: .62em; }
  #rivalCard .plate { transform: rotate(1deg); text-align: right; }
  .health { display: block; height: 13px; margin: 5px 0 0 2px; background: #817b71; border: 2.5px solid var(--ink); overflow: hidden; border-radius: 5px 3px 6px 3px; }
  .health i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(-50deg, #fd522e 0 24px, #e23921 25px 31px); transition: width .19s; }
  #rivalCard i { margin-left: auto; background: repeating-linear-gradient(50deg, #f48236 0 24px, #d45626 25px 31px); }
  .gear { position: absolute; top: 3%; right: 4%; width: 40px; height: 39px; padding: 0; display: grid; place-items: center; background: var(--stone); font: 900 25px/1 system-ui; z-index: 2; }
  .phase { position: absolute; inset: 25% 0 auto; text-align: center; font: 1000 10cqw/1 'Arial Black', system-ui; color: #fff2d9; paint-order: stroke fill; -webkit-text-stroke: .12em var(--ink); pointer-events: none; }
  .modal { background: #28231db0; display: grid; place-items: center; padding: 5%; z-index: 3; }
  .panel { width: min(100%, 325px); padding: 20px 14px; background: #eae0cd; border: 3px solid var(--ink); border-radius: 11px 18px 12px 16px; box-shadow: 0 5px var(--ink); }
  .panel .action { margin-top: 15px; }
  .menu { display: grid; gap: 9px; margin-top: 15px; }
  .menu .action { margin: 0; }
  .menu .secondary { background: var(--stone); }
  .controls { min-height: 114px; padding: 3px 11px 9px; text-align: center; }
  .route { position: relative; height: 18px; margin: 0 3px 5px; }
  .route::before { content: ''; position: absolute; inset: 10px 0 auto; height: 3px; background: repeating-linear-gradient(92deg, var(--ink) 0 14px, transparent 15px 27px); border-radius: 2px; transform: rotate(-.35deg); }
  .route i { position: absolute; top: 0; left: 0; width: 17px; height: 14px; border: 2px solid var(--ink); background: var(--lime); border-radius: 60% 55% 33% 41%; transform: skewX(-9deg); }
  .toolbar { display: grid; grid-template-columns: 1fr 1fr 1.2fr 1fr 1fr; align-items: center; gap: clamp(3px, 1.4vw, 8px); }
  .slot { display: grid; align-content: center; justify-items: center; gap: 1px; height: 60px; min-width: 0; padding: 0 1px; background: var(--slot-color, #aaa499); letter-spacing: -.035em; transform: rotate(-1.2deg); }
  .slot:nth-child(even) { transform: rotate(1.2deg); }
  .slot:disabled { cursor: default; box-shadow: 0 2px var(--ink); }
  .slot[data-state="ready"]:not(:disabled) { box-shadow: 0 3px var(--ink), 0 0 0 2px #fff4dc; }
  .slot[data-state="spent"] { background: #b0a89a; }
  .slot[data-state="spent"] .slot-icon { opacity: .45; }
  .slot-icon { font: 900 clamp(1.05rem, 5vw, 1.6rem)/1 system-ui; }
  .slot-label { font-size: clamp(.46rem, 2vw, .64rem); text-transform: uppercase; }
  #jump { --slot-color: var(--lime); font-size: clamp(.59rem, 2.5vw, .87rem); }
  #jump:disabled { --slot-color: #aea99d; }
  .hint { display: grid; place-items: center; min-height: 19px; margin-top: 4px; font-size: clamp(.59rem, 2vw, .71rem); line-height: 1.13; }
  .idle { min-height: 57px; display: grid; place-items: center; padding: 9px 13px; font: 800 clamp(.72rem, 3vw, .93rem)/1.2 Tahoma, sans-serif; text-align: center; }
  @media (max-height: 530px) {
    .cabinet { width: min(100%, 400px, max(208px, calc((100svh - 93px) * .8))); }
    .controls { min-height: 87px; padding: 1px 6px 4px; }
    .slot { height: 45px; }
    .hint { margin-top: 3px; }
    .idle { min-height: 40px; }
    .panel { padding: 10px 8px; }
    .menu { margin-top: 8px; gap: 6px; }
    .menu .action { min-height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) { .health i { transition: none; } }
  .home-actions { position: absolute; inset: auto 7% 6%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .home-actions #fight { grid-column: 1 / -1; justify-self: center; min-width: 50%; transform: rotate(-2deg); }
  .secondary { background: var(--stone); }
  .meta { background: #ded5c4; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; padding: 4%; text-align: left; }
  .meta-header, .meta-wallet { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .meta-wallet { padding: 6px 8px; background: #c5bbab; border: 2px solid var(--ink); border-radius: 8px; font-weight: 800; font-size: clamp(.67rem, 3.5cqw, .87rem); }
  .meta .action { padding-inline: 9px; min-height: 36px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(44px, 1fr); gap: 6px; overflow: auto; padding: 3px; scrollbar-color: #716458 #c5bbab; }
  .skill-card { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 5px; background: #f2e5cf; border: 2px solid var(--ink); border-radius: 8px; text-align: left; color: var(--ink); font: 900 clamp(.66rem, 3.25cqw, .87rem)/1.11 system-ui; cursor: pointer; }
  .skill-card[aria-pressed="true"] { background: var(--lime); box-shadow: 0 2px var(--ink); }
  .skill-card small { display: block; font-weight: 700; opacity: .76; }
  .skill-icon { width: 26px; height: 26px; flex: none; }
  .slot .skill-icon { width: 57%; height: auto; max-height: 37px; }
  .slot[data-state="ready"] { background: #efe5ce; }
  .slot[data-state="spent"] .skill-icon { opacity: .35; }
  .meta-detail { padding: 8px 10px; background: #fbefd8; border: 2px solid var(--ink); border-radius: 9px; font-size: clamp(.67rem, 3.25cqw, .86rem); }
  .meta-detail h3 { margin: 0 0 3px; font-size: 1.12em; }
  .meta-detail p + p { margin-top: 3px; }
  .meta-detail .action { margin-top: 5px; }
  .meta-detail .action:disabled { background: #c9beab; cursor: default; }
  .pickup-stack { position: absolute; top: 17%; left: 4%; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
  .pickup-stack span { border: 2px solid var(--ink); border-radius: 5px 8px 7px 4px; background: #9ffaf0; padding: 4px 7px; font: 950 clamp(.62rem, 3.75cqw, 1rem)/1 system-ui; box-shadow: 0 2px var(--ink); transform: rotate(-3deg); }
  .pickup-stack #slimeToast { background: #ffb2ea; transform: rotate(2deg); }
  .equipment-toast { position: absolute; inset: 27% 3% auto; display: flex; align-items: center; justify-content: center; gap: 3%; padding: 8px 3px; color: #fff6dd; background: #231923; border: 3px solid var(--ink); border-radius: 10px 14px 9px 12px; box-shadow: 4px 5px #75294c, 0 0 0 3px #ffe150; font: 950 clamp(.7rem, 4.5cqw, 1.25rem)/1.1 system-ui; text-align: center; transform: rotate(-3deg); pointer-events: none; animation: banner-in .24s ease-out; }
  .equipment-toast strong { display: block; color: #ffe150; font-size: 1.5em; }
  .equipment-toast::before, .equipment-toast::after { content: ''; flex: 0 0 13%; height: 37px; background: #ffe150; clip-path: polygon(32% 0, 88% 0, 60% 39%, 100% 34%, 19% 100%, 38% 53%, 0 65%); }
  .equipment-toast::after { transform: scaleX(-1); }
  @keyframes banner-in { from { opacity: 0; transform: scale(.68) rotate(8deg); } }
  @media (max-height: 530px) { .meta { gap: 5px; padding: 3%; } .meta-detail { padding: 5px 7px; } .meta-grid { grid-auto-rows: minmax(32px, 1fr); } .skill-card { min-height: 32px; } .skill-card .skill-icon { width: 19px; height: 19px; } }
  @media (prefers-reduced-motion: reduce) { .equipment-toast { animation: none; } }
  .cabinet { --footer-height: 114px; }
  .controls, .idle, .meta-footer { height: var(--footer-height); min-height: 0; }
  .home-actions { inset: auto 5% 4%; gap: 9px 10px; grid-template-columns: repeat(3, 1fr); }
  .home-actions #fight { min-width: 54%; }
  .home-actions .secondary { background: #f1e4c8; transform: rotate(-2deg); }
  .home-actions .secondary:nth-child(odd) { transform: rotate(2deg); }
  .home-actions .action { padding-inline: 4px; }
  .result-actions, .detail-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px; }
  .result-actions .action { padding-inline: 12px; }
  .arena-clock { position: absolute; top: 17%; right: 4%; padding: 4px 6px; border: 2px solid var(--ink); border-radius: 7px 5px 8px 5px; box-shadow: 0 2px var(--ink); background: #fff1d5; font: 950 clamp(.6rem, 3.6cqw, .93rem)/1 system-ui; pointer-events: none; }
  .arena-clock[data-urgent="true"] { background: #ff8e73; }
  .detail-actions { justify-content: flex-start; }
  .meta-footer { display: grid; align-content: center; text-align: center; padding: 5px 12px; gap: 6px; font: 800 .72rem/1.15 system-ui; }
  .lab-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .lab-slots .slot[data-equipped="true"], .skill-card[data-equipped="true"] { background: var(--lime); }
  .skill-card[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .skill-card[aria-pressed="true"]:not([data-equipped="true"]) { background: #ffedbc; }
  .meta .action { font-size: clamp(.66rem, 3.75cqw, 1.03rem); }
  .equipment-toast { inset: 21% 3% auto; background: transparent; border: 0; box-shadow: none; color: #fff8dc; text-shadow: 2px 2px #241b22, -2px -1px #241b22, 2px -1px #241b22, -2px 2px #241b22; }
  .equipment-toast strong { text-shadow: 3px 3px #4d2351, -2px -2px #261924, 2px -2px #261924, -2px 2px #261924; }
  .equipment-toast::before, .equipment-toast::after { filter: drop-shadow(2px 2px #4d2351); }
  .slot[data-state="cooldown"] { background: #b5aa99; }
  .slot[data-state="cooldown"] .skill-icon { opacity: .45; }
  .cooldown { position: absolute; top: 3px; right: 5px; font: 900 clamp(.61rem, 2.5vw, .8rem)/1 system-ui; }
  .progress-list, .custom-list { overflow: auto; min-height: 0; scrollbar-color: #716458 #c5bbab; }
  .progress-list { display: grid; position: relative; gap: 8px; align-content: start; padding: 5px 10px 9px; }
  .progress-node { min-height: 58px; display: grid; grid-template-columns: 31px 1fr; gap: 8px; align-items: center; position: relative; }
  .progress-node::before { content: ''; position: absolute; left: 14px; top: -17px; bottom: 22px; width: 3px; background: var(--ink); z-index: 0; }
  .progress-node:first-child::before { top: 22px; }
  .progress-dot { width: 24px; height: 24px; display: grid; place-items: center; margin-left: 4px; border: 3px solid var(--ink); border-radius: 46% 54% 43% 51%; background: #c5bba9; z-index: 1; font-weight: 900; }
  .progress-node[data-unlocked="true"] .progress-dot { background: var(--lime); }
  .progress-reward { display: grid; grid-template-columns: 29px 1fr; align-items: center; gap: 8px; background: #f3e8d0; border: 2px solid var(--ink); border-radius: 8px 9px 6px 7px; padding: 6px; font: 800 clamp(.69rem, 3.4cqw, .94rem)/1.17 system-ui; }
  .progress-reward small, .custom-choice small { display: block; font-weight: 650; }
  .custom-list h3 { margin: 5px 0 3px; font-size: clamp(.74rem, 4cqw, 1.05rem); }
  .custom-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 3px; }
  .custom-choice { min-width: 0; min-height: 49px; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 4px 2px; border: 2px solid var(--ink); border-radius: 8px; background: #f3e8d0; color: var(--ink); font: 850 clamp(.58rem, 2.7cqw, .76rem)/1.08 system-ui; cursor: pointer; }
  .custom-choice[aria-pressed="true"] { background: var(--lime); }
  .custom-choice:disabled { background: #cabeab; cursor: default; }
  .swatch { display: grid; place-items: center; justify-self: center; width: 25px; height: 22px; border: 2px solid var(--ink); border-radius: 7px; background: var(--swatch, #fff6df); font: 900 15px/1 system-ui; }
  .custom-preview { display: flex; align-items: center; gap: 10px; padding: 4px 9px; border: 2px solid var(--ink); border-radius: 11px; background: #c7bdab; font: 850 clamp(.68rem, 3.6cqw, .91rem)/1.2 system-ui; }
  .custom-preview svg { flex: 0 0 98px; height: 64px; }
  @media (max-height: 530px) { .cabinet { --footer-height: 87px; } .home-actions { gap: 6px; } .home-actions .action { min-height: 31px; font-size: .63rem; } .custom-preview svg { height: 43px; } }
</style>
</head>
<body>
<main class="cabinet" aria-label="Battle Slimes">
  <div class="stage">
    <canvas id="world" width="480" height="600" aria-label="Slime track and arena"></canvas>
    <section id="cover" class="overlay cover">
      <h1>Battle <span>Slimes</span></h1>
      <div class="home-actions">
        <button type="button" id="fight" class="action">FIGHT!</button>
        <button type="button" id="skillLab" class="action secondary">Skill Lab</button>
        <button type="button" id="progress" class="action secondary">Progress</button>
        <button type="button" id="customize" class="action secondary">Customize</button>
      </div>
    </section>
    <section id="meta" class="overlay meta" hidden>
      <div class="meta-header"><h2 id="metaTitle"></h2><button id="metaBack" type="button" class="action secondary">Back</button></div>
      <div class="meta-wallet"><span id="metaPoints"></span><span id="metaRating"></span><span id="metaCount"></span></div>
      <div class="meta-grid" id="metaGrid" aria-label="Skills"></div>
      <div class="progress-list" id="progressList" hidden></div>
      <div class="custom-list" id="customList" hidden></div>
      <div class="custom-preview" id="customPreview" hidden></div>
      <div class="meta-detail" id="metaDetail">
        <h3 id="detailName"></h3><p id="detailText"></p><p id="detailUpgrade"></p>
        <div class="detail-actions"><button id="metaEquip" type="button" class="action"></button><button id="metaAction" type="button" class="action secondary"></button></div>
      </div>
    </section>
    <section id="match" class="overlay match" hidden>
      <h2>Finding a rival</h2>
      <p id="matchStatus" role="status"></p>
      <div class="opponent"><strong id="matchName"></strong><small class="score" id="matchScore" hidden></small></div>
    </section>
    <div id="hud" class="hud" hidden>
      <div class="fighter"><span class="plate"><span class="fighter-name">PLAYER</span><small class="score" id="playerScore">Rating 1000</small></span><span class="health" id="playerHealth" role="meter" aria-label="Player health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></span></div>
      <div class="fighter" id="rivalCard" hidden><span class="plate"><span class="fighter-name" id="rivalName"></span><small class="score" id="rivalScore"></small></span><span class="health" id="rivalHealth" role="meter" aria-label="Rival health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></span></div>
    </div>
    <button type="button" id="settings" class="gear" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" hidden>⚙</button>
    <div class="pickup-stack" aria-live="polite">
      <span id="sizeToast" hidden></span><span id="slimeToast" hidden></span>
    </div>
    <div id="equipmentToast" class="equipment-toast" role="status" hidden><span>Small minions got <strong id="equipmentName"></strong></span></div>
    <div id="arenaClock" class="arena-clock" aria-label="Time left in the fight" hidden></div>
    <div id="phase" class="phase" role="status" hidden></div>
    <section id="settingsPanel" class="overlay modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <div class="panel">
        <h2 id="settingsTitle">Settings</h2>
        <div class="menu">
          <button type="button" id="resume" class="action">Resume</button>
          <button type="button" id="mute" class="action secondary">Sound: On</button>
          <button type="button" id="newFight" class="action secondary">New Fight</button>
          <button type="button" id="exit" class="action secondary">Exit to Menu</button>
        </div>
      </div>
    </section>
    <section id="result" class="overlay modal" aria-labelledby="outcome" hidden>
      <div class="panel"><h2 id="outcome"></h2><p id="summary"></p><div class="result-actions"><button type="button" id="again" class="action">New Fight</button><button type="button" id="resultMenu" class="action secondary">Main Menu</button></div></div>
    </section>
  </div>
  <div id="controls" class="controls" hidden>
    <div id="route" class="route" role="progressbar" aria-label="Route progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <div class="toolbar">
      <button type="button" id="skill1" class="slot" disabled></button>
      <button type="button" id="skill2" class="slot" disabled></button>
      <button type="button" id="jump" class="slot"><span class="slot-icon" aria-hidden="true">↑</span>JUMP</button>
      <button type="button" id="skill3" class="slot" disabled></button>
      <button type="button" id="skill4" class="slot" disabled></button>
    </div>
    <p id="hint" class="hint" role="status"></p>
  </div>
  <div id="metaFooter" class="meta-footer" hidden>
    <div id="labSlots" class="lab-slots" aria-label="Equipped skills"></div>
    <span id="metaFooterText"></span>
  </div>
  <p id="idle" class="idle"><span id="homeStats"></span></p>
</main>
<script>
'use strict';

const $ = id => document.getElementById(id);
const ctx = $('world').getContext('2d');
const width = 480;
const height = 600;
const ink = '#171714';
const cream = '#fff0cf';
const green = '#a0f522';
const orange = '#ff5025';
const rivalTints = ['#ff5025', '#ac78ff', '#5ecaff', '#efb947', '#fc72b1', '#47dfbc'];
const cosmetics = {
  arena: [
    { id: 'classic', name: 'Classic', color: '#beb7aa', rating: 0 },
    { id: 'lava', name: 'Lava Arena', color: '#ff741d', rating: 1125 },
    { id: 'ice', name: 'Ice Arena', color: '#9eeeff', rating: 1075 },
    { id: 'grass', name: 'Grass Arena', color: '#98ce6b', rating: 1025 },
    { id: 'crystal', name: 'Crystal Cave', color: '#c791ff', rating: 1175 },
  ],
  color: [
    { id: 'lime', name: 'Lime', color: green, rating: 0 },
    { id: 'coral', name: 'Coral', color: '#ff8774', rating: 1000 },
    { id: 'sky', name: 'Sky Blue', color: '#5ecaff', rating: 1025 },
    { id: 'violet', name: 'Violet', color: '#ac78ff', rating: 1125 },
  ],
  eyes: [
    { id: 'classic', name: 'Classic', icon: '●', rating: 0 },
    { id: 'amber', name: 'Amber Eyes', icon: '◆', rating: 1050 },
    { id: 'star', name: 'Star Eyes', icon: '★', rating: 1100 },
  ],

function unlockSound() {
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (muted || !Audio) return;
  try {
    if (!audio) {
      audio = new Audio();
      master = audio.createGain();
      master.gain.value = .19;
      master.connect(audio.destination);
      noise = audio.createBuffer(1, Math.ceil(audio.sampleRate * .27), audio.sampleRate);
      const samples = noise.getChannelData(0);
      for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
    }
    if (audio.state !== 'running') audio.resume().catch(() => {});
  } catch { /* The game also runs on browsers with restricted audio. */ }
}

function toggleSound() {
  muted = !muted;
  try { localStorage.setItem('battle-slimes-muted', String(muted)); } catch { /* Session setting still applies. */ }
  if (!muted) unlockSound();
  if (master) master.gain.setTargetAtTime(muted ? 0 : .19, audio.currentTime, .025);
  $('mute').textContent = muted ? 'Sound: Off' : 'Sound: On';
  if (!muted) sound('pickup', .55);
}

function sound(id, strength = 1) {
  if (muted || !master || !noise || audio.state !== 'running') return;
  const now = audio.currentTime;
  if (id === 'bite' || id === 'shot') {
    if (now - lastBiteSound < .095) return;
    lastBiteSound = now;
  }
  const { notes, grit } = soundEffects[id];
  for (const [from, to, duration, delay = 0, wave = 'triangle', volume = 1] of notes) {
    const at = now + delay;
    const oscillator = audio.createOscillator();
    oscillator.type = wave;
    oscillator.frequency.setValueAtTime(from, at);
    oscillator.frequency.exponentialRampToValueAtTime(to, at + duration);
    oscillator.connect(envelope(at, duration, strength * volume * .62));
    oscillator.start(at);
    oscillator.stop(at + duration + .015);
  }
  if (grit) {
    const [pitch, duration, volume, endPitch = pitch] = grit;
    const source = audio.createBufferSource();
    source.buffer = noise;
    const filter = audio.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = id === 'grunt' ? 3.1 : 1.6;
    filter.frequency.setValueAtTime(pitch, now);
    filter.frequency.exponentialRampToValueAtTime(endPitch, now + duration);
    source.connect(filter);
    filter.connect(envelope(now, duration, strength * volume));
    source.start(now);
    source.stop(now + duration);
  }
}

function envelope(at, duration, volume) {
  const gain = audio.createGain();
  gain.gain.setValueAtTime(.0001, at);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002, volume), at + .012);
  gain.gain.exponentialRampToValueAtTime(.0001, at + duration);
  gain.connect(master);
  return gain;
}

function readMeta() {
  const starters = skillKeys.filter(id => skills[id].cost === 0);
  const data = { points: 0, rating: 1000, peakRating: 1000, difficulty: .26,
    regularWins: 0, overdriveWins: 0, nextRivalNormal: false,
    levels: Object.fromEntries(starters.map(id => [id, 1])), loadout: starters,
    appearance: { arena: 'classic', color: 'lime', eyes: 'classic', sparkle: 'none' } };
  try {
    const saved = JSON.parse(localStorage.getItem('battle-slimes-meta') ?? 'null');
    const points = saved?.points ?? Number(localStorage.getItem('battle-slimes-score'));
    if (Number.isSafeInteger(points) && points >= 0) data.points = points;
    if (Number.isSafeInteger(saved?.rating) && saved.rating >= 0) data.rating = saved.rating;
    data.peakRating = Number.isSafeInteger(saved?.peakRating) ? Math.max(data.rating, saved.peakRating) : Math.max(1000, data.rating);
    if (typeof saved?.difficulty === 'number' && Number.isFinite(saved.difficulty)) data.difficulty = clamp(saved.difficulty, .04, 1);
    const regularWins = saved?.regularWins ?? saved?.winStreak;
    if (Number.isSafeInteger(regularWins)) data.regularWins = clamp(regularWins, 0, 3);
    if (Number.isSafeInteger(saved?.overdriveWins) && saved.overdriveWins >= 0) data.overdriveWins = saved.overdriveWins;
    data.nextRivalNormal = saved?.nextRivalNormal === true;
    for (const [type, items] of Object.entries(cosmetics)) {
      const item = items.find(item => item.id === saved?.appearance?.[type] && item.rating <= data.peakRating);
      if (item) data.appearance[type] = item.id;
    }
    for (const id of skillKeys) {
      const level = saved?.levels?.[id];
      if (Number.isInteger(level) && level >= 1 && level <= skills[id].value.length) data.levels[id] = level;
    }
    if (Array.isArray(saved?.loadout)) data.loadout = [...new Set(saved.loadout)].filter(id => skillKeys.includes(id) && data.levels[id]).slice(0, 4);
  } catch { /* The default profile also works without storage. */ }
  return data;
}

function saveMeta() {
  try { localStorage.setItem('battle-slimes-meta', JSON.stringify(meta)); } catch { /* Keep the profile for the session. */ }

function renderLab(keepSelectionFocus) {
  $('metaCount').textContent = `Equipped ${meta.loadout.length}/4`;

    card.dataset.equipped = String(equipped);
    const status = !level ? 'Locked' : equipped ? `Equipped · Lv. ${level}` : `Level ${level}`;
    card.innerHTML = `${skillIcon(id)}<span>${skills[id].name}<small>${status}</small></span>`;
    card.addEventListener('click', () => { selectedSkill = id; renderLab(true); });
    grid.append(card);
    if (keepSelectionFocus && id === selectedSkill) card.focus({ preventScroll: true });
  }
  const id = selectedSkill;
  const skill = skills[id];
  const level = meta.levels[id] ?? 0;
  const equipped = meta.loadout.includes(id);
  const cost = skillCost(id, level);
  const maxed = level === skill.value.length;
  $('detailName').textContent = level ? `${skill.name} · Level ${level}` : `${skill.name} · Locked`;
  $('detailText').textContent = `${skillDescription(id, level || 1)} Cooldown: ${cooldowns[id]}s.`;
  $('detailUpgrade').textContent = level && !maxed ? `Next level: ${skillDescription(id, level + 1)}` : '';
  const equip = $('metaEquip');
  equip.disabled = !level || (!equipped && meta.loadout.length >= 4);
  equip.textContent = !level ? 'Locked' : equipped ? 'Unequip' : meta.loadout.length >= 4 ? 'Slots full' : 'Equip';
  equip.onclick = () => {
    if (equip.disabled) return;
    if (equipped) meta.loadout = meta.loadout.filter(equippedId => equippedId !== id);
    else meta.loadout.push(id);
    saveMeta();
    renderLab(false);
  };
  const action = $('metaAction');
  action.disabled = maxed || meta.points < cost;
  action.textContent = maxed ? 'Max level' : `${level ? 'Upgrade' : 'Unlock'} · ${cost} Points`;
  action.onclick = () => {
    if (action.disabled) return;
    meta.points -= cost;
    meta.levels[id] = level + 1;
    saveMeta();
    renderMeta();
  };
  const slots = $('labSlots');
  slots.replaceChildren();
  for (let i = 0; i < 4; i++) {
    const slot = document.createElement('button');
    const skillId = meta.loadout[i];
    slot.type = 'button';
    slot.className = 'slot';
    slot.disabled = !skillId;
    slot.dataset.equipped = String(!!skillId);
    slot.setAttribute('aria-label', skillId ? `Slot ${i + 1}: ${skills[skillId].name}` : `Empty slot ${i + 1}`);
    if (skillId) {
      slot.innerHTML = skillIcon(skillId);
      slot.addEventListener('click', () => { selectedSkill = skillId; renderLab(true); });
    }
    slots.append(slot);
  }
}

  if (meta.nextRivalNormal || (meta.regularWins < 3 && Math.random() >= .27)) return null;
  const wins = meta.overdriveWins;
  return { tier: wins + 1, health: 1.15 + wins * .07,
    cooldown: Math.max(.45, .7 - wins * .025), damage: 1 + Math.min(.45, wins * .045) };
}
