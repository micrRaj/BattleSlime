  unlockSound();
  const previous = rival;
  do {
    rival = pick(['Bog', 'Acid', 'Gutter', 'Jelly', 'Sour', 'Grave', 'Muck', 'Toxic']) +
      pick(['Fang', 'Gulp', 'Snap', 'Gnasher', 'Jaw', 'Blob']) + ' ' + Math.floor(10 + Math.random() * 90);
  } while (rival === previous);
  const moods = ['smug', 'nervous', 'furious', 'bored', 'wild'];
  const style = Math.random();
  const overdrive = rollOverdrive();
  enemy = {
    growth: 0, tail: 0, mood: pick(moods), overdrive,
    rating: Math.max(0, meta.rating + Math.floor(Math.random() * 161) - 80),
    tint: style < .28 ? orange : pick(rivalTints.slice(1)),
    appearance: style < .63 ? null : { eyes: pick(cosmetics.eyes).id, sparkle: pick(cosmetics.sparkle.slice(1)).id },
  };
  enemy.moods = moods.filter(mood => mood !== enemy.mood);
  const rating = `Rating ${enemy.rating}${overdrive ? ` · Overdrive ${overdrive.tier}` : ''}`;
  $('matchStatus').textContent = 'Searching…';
  $('matchName').textContent = '…';
  show('matchScore', false);
  $('matchScore').textContent = rating;
  $('rivalScore').textContent = rating;
  $('rivalScore').title = overdrive ? `Overdrive ${overdrive.tier} · +${Math.round((overdrive.health - 1) * 100)}% health · ${Math.round((1 - overdrive.cooldown) * 100)}% shorter cooldowns` : '';
  $('rivalName').textContent = rival;
  setScene('match');
}

function segmentHeight(points, x) {
  for (let i = 1; i < points.length; i++) {
    const [rightX, rightY] = points[i];
    if (x > rightX) continue;
    const [leftX, leftY] = points[i - 1];
    const t = (x - leftX) / (rightX - leftX);
    return mix(leftY, rightY, mix(t, smooth(t), .32));
  }
  return 0;
}

function ground(x) {
  const hills = 50 * Math.sin(x / 169 + routeSeed) + 23 * Math.sin(x / 77 + 1.7);
  let y = arenaY + hills * smooth(clamp((course - x) / 570, 0, 1));
  const pit = pits.find(pit => x >= pit.x && x <= pit.x + 237);
  if (pit) {
    const t = (x - pit.x) / 237;
    const rim = mix(ground(pit.x - 1), ground(pit.x + 238), t);
    return mix(y, rim, Math.sin(Math.PI * t) ** 2) + segmentHeight(pitShape, x - pit.x) * pit.scale;
  }
  for (const rise of rises) if (x >= rise.x && x <= rise.x + rise.points.at(-1)[0]) y += segmentHeight(rise.points, x - rise.x);
  return y;
}

function grade(x) { return (ground(x + 4) - ground(x - 4)) / 8; }

function newMotion() {
  return { y: ground(0), vy: 0, vx: cruise, airborne: false, stretch: 0, dustTimer: 0, jumpBuffer: 0 };
}

function makeBoosters() {
  const items = Array.from({ length: 26 }, (_, i) => {
    const x = 360 + i * 478 + Math.random() * 28;
    const pit = pits.find(pit => x > pit.x && x < pit.x + 240);
    return { x: pit ? pit.x + 128 : x, high: i % 3 !== 0, type: i % 4 === 1 || i % 6 === 3 ? 'tail' : 'growth' };
  });
  for (const x of [2600, 5950, 9700]) items.push({ x, high: x !== 5950, type: equipmentType });
  return items.sort((a, b) => a.x - b.x).map(({ x, high, type }) => {
    const progress = x / course;
    const elevation = 35 + progress * 76 + (high ? 40 + progress * 64 : 0);
    return { x, elevation, type, eaten: false };
  });
}

function startRun() {
  routeSeed = Math.random() * 6;
  player = { growth: 0, tail: 0, boosterCount: 0, mood: 'focused' };
  distance = 0;
  motion = newMotion();
  bite = 0;
  effects = [];
  followers = [];
  notice = null;
  inventory = Array.from({ length: 4 }, (_, i) => {
    const id = meta.loadout[i];
    return id ? { id, level: meta.levels[id], readyAt: 0 } : null;
  });
  equipmentToastUntil = 0;
  equipmentType = pick(Object.keys(equipment));
  boosters = makeBoosters();
  enemy.position = 0;
  enemy.motion = newMotion();
  enemy.difficulty = enemy.overdrive ? Math.max(.68, meta.difficulty) : meta.difficulty;
  enemy.boosters = boosters.map(item => ({ ...item, noticed: Math.random() < .03 + enemy.difficulty * .94 }));
  enemy.jumpLead = .29 + enemy.difficulty * .08 + Math.random() * .06;
  setScene('run');
  sound('start');
  updateHud();
  $('jump').focus({ preventScroll: true });
}

function updateControls() {
  const canUse = scene === 'arena' && elapsed >= impactTime && fightEnded === null && !paused;
  $('jump').disabled = scene !== 'run' || paused;
  $('controls').inert = paused;
  inventory.forEach((charge, i) => {
    const slot = $(`skill${i + 1}`);
    const remaining = charge && scene === 'arena' ? Math.max(0, charge.readyAt - elapsed) : 0;
    const state = !charge ? 'empty' : remaining > 0 ? 'cooldown' : 'ready';
    const skill = charge && skills[charge.id];
    const key = charge && `${charge.id}-${charge.level}`;
    if (slot.dataset.state !== state || slot.dataset.skill !== (key || undefined)) {
      slot.dataset.state = state;
      if (charge) slot.dataset.skill = key;
      else delete slot.dataset.skill;
      slot.innerHTML = skill ? `${skillIcon(charge.id)}<span class="cooldown" aria-hidden="true" hidden></span>` : '';
    }
    const seconds = Math.ceil(remaining);
    const label = !skill ? `Empty skill slot ${i + 1}` : `${skill.name}${seconds ? ` · ${seconds}s cooldown` : ''}. ${skillDescription(charge.id, charge.level)}`;
    if (slot.getAttribute('aria-label') !== label) {
      slot.setAttribute('aria-label', label);
      slot.title = label;
      if (skill) {
        const clock = slot.lastElementChild;
        clock.hidden = !seconds;
        clock.textContent = seconds || '';
      }
    }
    slot.disabled = !canUse || state !== 'ready';
  });
  const upcomingPit = scene === 'run' ? pits.find(pit => distance >= pit.x - 175 && distance <= pit.x + 208) : null;
  const hint = upcomingPit ? (distance < upcomingPit.x + 43 ? 'Pit ahead · Space / ↑ to jump' : 'Jump to clear the pit')
    : notice && elapsed < notice.until ? notice.text : scene === 'run'
    ? 'Space / ↑ to jump'
    : elapsed < impactTime && scene === 'arena' ? 'Skills unlock when the slimes clash'
    : scene === 'result' ? 'Fight over' : 'Tap a skill or press 1–4';
  if ($('hint').textContent !== hint) $('hint').textContent = hint;
}

function updateHud() {
  const label = `Rating ${meta.rating}`;
  if ($('playerScore').textContent !== label) $('playerScore').textContent = label;
  const route = $('route');
  const progress = Math.round(distance / course * 100);
  if (route.getAttribute('aria-valuenow') !== String(progress)) {
    route.firstElementChild.style.left = `calc(${progress}% - ${progress * .17}px)`;
    route.setAttribute('aria-valuenow', progress);
  }
  for (const [id, fighter] of [['playerHealth', player], ['rivalHealth', enemy]]) {
    const meter = $(id);
    const leader = scene === 'run' ? null : fighter.fighters[0];
    const health = leader ? Math.ceil(100 * leader.hp / leader.maxHp) : 100;
    if (meter.getAttribute('aria-valuenow') !== String(health)) {
      meter.firstElementChild.style.width = `${health}%`;
      meter.setAttribute('aria-valuenow', health);
    }
  }
}

function jump() {
  if (scene !== 'run' || paused) return;
  motion.jumpBuffer = .14;
  if (!motion.airborne) launchJump(player, distance, motion, true);
}

function inPit(x) { return pits.some(pit => x >= pit.x + 68 && x < pit.x + 208); }

function jumpVelocity(team, x, state) {
  const pit = inPit(x);
  const speed = pit ? Math.min(state.vx, 363) : state.vx;
  return (pit ? -582 : -445) - team.growth * 13 + clamp(grade(x) * speed * .16, -38, 29);
}

function launchJump(team, x, state, feedback) {
  state.jumpBuffer = 0;
  state.airborne = true;
  state.vy = jumpVelocity(team, x, state);
  if (inPit(x)) state.vx = Math.min(state.vx, 363);
  state.y -= 1;
  state.stretch = -.55;
  if (feedback) {
    burst(x, ground(x), '#6b6153');
    sound('jump');
  }
}

function size(team) { return 77 + team.growth * 6; }

function makeSlime(team, leader, mood, delay) {
  const baseHp = leader ? 675 + team.growth * 23 : 82 + team.growth * 1.34;
  const maxHp = Math.round(baseHp * (team.overdrive?.health ?? 1));
  const appearance = team === player ? meta.appearance : (leader || Math.random() < .45 ? team.appearance : null);
  return { hp: maxHp, maxHp, leader, mood, appearance, nextHit: elapsed + delay,
    lastHit: -10, lastDamage: -10 };
}

function chooseRivalSkills(team) {
  const builds = [
    ['rage', 'haste', 'leech', 'stun'],
    ['guard', 'mend', 'rage', 'revive'],
    ['haste', 'leech', 'guard', 'stun'],
  ];
  if (team.tail >= 3) builds.push(['split', 'rage', 'haste', 'revive']);
  if (team.equipment === 'blaster') builds.push(['haste', 'rage', 'split', 'guard']);
  if (team.tail >= 3 && meta.loadout.includes('split')) builds.push(['guard', 'split', 'rage', 'mend']);
  const slots = team.overdrive || team.difficulty >= .46 ? 4 : 3;
  const loadout = pick(builds).slice(0, slots).map(id => ({ id, level: 1, readyAt: 0 }));
  let budget = 68 + Math.floor(team.difficulty * 140) + (team.overdrive ? Math.min(110, 45 + (team.overdrive.tier - 1) * 12) : 0);
  // Shop at the same upgrade prices as the player, upgrading a build's leading skills first.
  for (const charge of loadout) {
    while (charge.level < skills[charge.id].value.length) {
      const cost = skillCost(charge.id, charge.level);
      if (budget < cost) break;
      budget -= cost;
      charge.level++;
    }
  }
  return loadout;
}

function startArena() {
  for (const team of [player, enemy]) {
    team.power = {};
    team.advance = 0;
    team.lineCount = 1;
    team.facing = team === player ? 1 : -1;
    team.fighters = [
      makeSlime(team, true, team.mood, 0),
      ...Array.from({ length: team.tail }, (_, i) => makeSlime(team, false, team.moods?.[i % team.moods.length] ?? 'focused', 0)),
    ];
    for (const [i, fighter] of team.fighters.entries()) {
      fighter.nextHit = impactTime + (team === player ? .12 : .24) + (i ? Math.random() * .18 : 0);
    }
  }
  enemy.plan = chooseRivalSkills(enemy).map((charge, i) => ({ ...charge,
    at: impactTime + .62 + .72 * i + (1 - enemy.difficulty) * 1.6 + Math.random() * .32 }));
  fightEnded = null;
  notice = null;
  effects = [];
  setScene('arena');
  updateHud();
  $('settings').focus({ preventScroll: true });
}

function toggleSettings() {
  if (scene !== 'run' && scene !== 'arena') return;
  paused = !paused;
  show('settingsPanel', paused);
  $('settings').setAttribute('aria-expanded', String(paused));
  updateControls();
  (paused ? $('resume') : $('settings')).focus({ preventScroll: true });
}

function exitToMenu() {
  setScene('cover');
  $('fight').focus({ preventScroll: true });
}

function finish(outcome = living(player).length ? 'Victory!' : living(enemy).length ? 'Defeat!' : 'Draw!', timedOut = false) {
  const won = outcome === 'Victory!';
  const lost = outcome === 'Defeat!';
  const multiplier = won ? 2 : lost ? .5 : 1;
  const earned = Math.ceil((player.boosterCount + player.tail * 2) * multiplier);
  const before = meta.rating;
  meta.points += earned;
  meta.rating = Math.max(0, before + (won ? 25 : lost ? -25 : 0));
  const change = meta.rating - before;
  meta.peakRating = Math.max(meta.peakRating, meta.rating);
  meta.difficulty = clamp(meta.difficulty + (won ? .08 : lost ? -.11 : 0), .04, 1);
  if (won && enemy.overdrive) meta.overdriveWins++;
  if (lost || enemy.overdrive) meta.regularWins = 0;
  else if (won) meta.regularWins = Math.min(3, meta.regularWins + 1);
  meta.nextRivalNormal = lost;
  saveMeta();
  $('outcome').textContent = outcome;
  $('summary').textContent = `${timedOut ? 'Time up · ' : ''}Boosters ${player.boosterCount} · Small Slimes ${player.tail} · +${earned} Points · Rating ${change >= 0 ? "+" : ""}${change}`;
  updateHud();
  notice = null;
  setScene('result');
  sound(won ? 'win' : 'lose', .7);
  $('again').focus({ preventScroll: true });
}

function burst(x, y, color, label = '', duration = .63) {
  effects.push({ x, y, color, label, duration, age: 0, angle: Math.random() * 6.28 });
}

function living(team) { return team.fighters.filter(fighter => fighter.hp > 0); }

function timeLimitResult() {
  const [leader, rivalLeader] = [player.fighters[0], enemy.fighters[0]];
  const leaderDifference = leader.hp / leader.maxHp - rivalLeader.hp / rivalLeader.maxHp;
  if (Math.abs(leaderDifference) > 1e-9) return leaderDifference > 0 ? 'Victory!' : 'Defeat!';
  const smallHp = team => team.fighters.reduce((hp, fighter) => hp + (fighter.leader ? 0 : fighter.hp), 0);
  const squadDifference = smallHp(player) - smallHp(enemy);
  return squadDifference > 0 ? 'Victory!' : squadDifference < 0 ? 'Defeat!' : 'Draw!';
}

function useSkill(team, charge) {
  const { id, level } = charge;
  if (scene !== 'arena' || paused || elapsed < impactTime || fightEnded !== null) return;
  const isPlayer = team === player;
  if (charge.readyAt > elapsed) return false;
  const skill = skills[id];
  const value = skill.value[level - 1];
  const foes = isPlayer ? enemy : player;
  if (id === 'mend') {
    const wounded = living(team).find(fighter => fighter.hp < fighter.maxHp);
    if (!wounded) {
      if (isPlayer) notice = { text: 'Your slimes are at full health', until: elapsed + 1.7 };
      return;
    }
    wounded.hp = Math.min(wounded.maxHp, wounded.hp + Math.ceil(wounded.maxHp * value));
  } else if (id === 'split') {
    const existing = living(team);
    if (existing.length >= lineupLimit) {
      if (isPlayer) notice = { text: 'Your lineup is full', until: elapsed + 1.7 };
      return false;
    }
    const copies = existing.slice(0, lineupLimit - existing.length).map(fighter =>
      makeSlime(team, false, fighter.mood, .22 + Math.random() * .21));
    for (const copy of copies) copy.hp = copy.maxHp = Math.round(copy.maxHp * value);
    team.fighters.push(...copies);
    team.lineCount = Math.min(4, team.lineCount + 1);
  } else if (id === 'stun') {
    for (const fighter of living(foes)) fighter.nextHit = Math.max(fighter.nextHit, elapsed) + value;
  } else if (id === 'revive') {
    const available = lineupLimit - living(team).length;
    if (available <= 0) {
      if (isPlayer) notice = { text: 'Your lineup is full', until: elapsed + 1.7 };
      return false;
    }
    const fallen = team.fighters.filter(fighter => !fighter.leader && fighter.hp === 0).slice(0, available);
    if (!fallen.length) {
      if (isPlayer) notice = { text: 'No fallen small slimes', until: elapsed + 1.7 };
      return false;
    }
    for (const fighter of fallen) {
      fighter.hp = Math.ceil(fighter.maxHp * value);
      fighter.nextHit = elapsed + .35 + Math.random() * .18;
      fighter.lastHit = -10;
      fighter.lastDamage = -10;
      fighter.shot = null;
    }
  } else {
    team.power[id] = { until: elapsed + 4, value };
    if (id === 'haste') {
      for (const fighter of living(team)) fighter.nextHit = elapsed + Math.max(0, fighter.nextHit - elapsed) / (1 + value);
    }
  }

  charge.readyAt = elapsed + cooldowns[id] * (team.overdrive?.cooldown ?? 1);
  sound(id, isPlayer ? 1 : .7);
  burst(isPlayer ? 135 : 345, arenaY - 92, isPlayer ? '#e1ff99' : '#ffd095', '', 1);
  updateControls();
  updateHud();
  return true;
}

function useSlot(index) {
  const charge = inventory?.[index];
  if (charge) useSkill(player, charge);
}

function touchesBooster(team, x, state, item, itemY) {
  const s = size(team);
  const halfWidth = s * .54 * (1 + state.stretch * .16);
  const halfHeight = s * .43 * (1 - state.stretch * .19);
  const radius = equipment[item.type] ? 18 : 16;
  const dx = (item.x - x - s * .045) / (halfWidth + radius);
  const dy = (itemY - state.y + halfHeight) / (halfHeight + radius);
  return dx * dx + dy * dy <= 1;
}

function moveRunner(team, x, state, dt, feedback) {
  const slope = grade(x);
  const gravityAlongTrack = gravity * slope / Math.hypot(1, slope);
  const pace = (cruise - state.vx) * (state.vx > cruise ? .44 : 1.10);
  // Uphill grip carries momentum while the steeper walls of pits still slow the slime.
  const traction = slope < -.95 ? .48 : slope < 0 ? .22 : .79;
  const acceleration = state.airborne ? (cruise - state.vx) * .08 : pace + gravityAlongTrack * traction;
  state.vx = clamp(state.vx + acceleration * dt, 164, 602);
  const oldY = state.y;
  x = Math.min(course, x + state.vx * dt);
  const trackY = ground(x);
  state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
  if (!state.airborne && trackY > oldY + state.vx * slope * dt + .5 * gravity * dt * dt + 1.15) {
    state.airborne = true;
    state.vy = clamp(state.vx * slope, -210, 190);
  }
  if (state.airborne) {
    state.y += state.vy * dt + .5 * gravity * dt * dt;
    state.vy += gravity * dt;
    if (state.y >= trackY) {
      const impact = Math.max(0, state.vy - state.vx * grade(x));
      state.y = trackY;
      state.airborne = false;
      state.stretch = clamp(impact / 350, .24, .94);
      if (feedback) {
        burst(x, state.y, '#766b5d');
        if (impact > 70) sound('land', clamp(impact / 320, .28, .96));
      }
    }
  } else {
    state.y = trackY;
    state.dustTimer -= dt;
    if (feedback && state.vx > 404 && state.dustTimer <= 0 && !reduceMotion) {
      burst(x - size(team) * .38, state.y + 2, '#827466', '', .34);
      state.dustTimer = .09;
    }
  }
  if (!state.airborne && state.jumpBuffer > 0) launchJump(team, x, state, feedback);
  state.stretch *= Math.exp(-dt * 9);
  return x;
}

function collectBoosters(team, x, state, lane, feedback) {
  for (const item of lane) {
    if (item.eaten || Math.abs(item.x - x) > 130) continue;
    const itemY = ground(item.x) - item.elevation;
    if (!touchesBooster(team, x, state, item, itemY)) continue;
    const special = equipment[item.type];
    if (special) {
      team.equipment = item.type;
      for (const option of lane) if (option.type === item.type) option.eaten = true;
    } else team[item.type]++;
    item.eaten = true;
    if (!feedback) continue;
    player.boosterCount++;
    bite = .4;
    if (special) {
      equipmentToastUntil = elapsed + 3;
      $('equipmentName').textContent = special.name.toUpperCase();
    }
    sound(special ? 'pickup' : item.type, .85);
    burst(item.x, itemY - 12, special?.color ?? colors[item.type], '+1', .88);
  }
}

function botWantsToJump(team) {
  const state = team.motion;
  if (state.airborne) return false;
  const x = team.position;
  const takeoff = jumpVelocity(team, x, state);
  for (const item of team.boosters) {
    if (item.eaten || item.noticed === false) continue;
    const time = (item.x - x - size(team) * .045) / state.vx;
    if (time > team.jumpLead || time < .15) continue;
    const itemY = ground(item.x) - item.elevation;
    const grounded = { y: ground(item.x), stretch: 0 };
    if (touchesBooster(team, item.x, grounded, item, itemY)) continue;
    const jumping = { y: state.y + takeoff * time + .5 * gravity * time ** 2, stretch: 0 };
    if (touchesBooster(team, item.x, jumping, item, itemY)) return true;
  }
  return false;
}

function updateRivalRun(dt) {
  if (enemy.position >= course) return;
  if (botWantsToJump(enemy)) launchJump(enemy, enemy.position, enemy.motion, false);
  enemy.position = moveRunner(enemy, enemy.position, enemy.motion, dt, false);
  collectBoosters(enemy, enemy.position, enemy.motion, enemy.boosters, false);
}

function updateRun(dt) {
  distance = moveRunner(player, distance, motion, dt, true);
  updateRivalRun(dt);
  bite = Math.max(0, bite - dt);
  if (!followers.length || distance - followers.at(-1).x > 4) {
    followers.push({ x: distance, lift: ground(distance) - motion.y });
    if (followers.length > 62) followers.shift();
  }
  collectBoosters(player, distance, motion, boosters, true);
  updatePickupDisplay();
  updateHud();
  updateControls();
  if (distance >= course) {
    // A rival that is still on the course finishes offscreen before entering the arena.
    while (enemy.position < course) updateRivalRun(1 / 60);
    startArena();
  }
}

function active(team, id) {
  const effect = team.power[id];
  return effect?.until > elapsed ? effect.value : 0;
}

function attack(team, attacker, targetTeam) {
  const enemies = living(targetTeam);
  if (!enemies.length) return;
  // Small slimes fan their bites across the front of the opposing line.
  const frontline = enemies.filter(fighter => !fighter.leader);
  const lane = team.fighters.indexOf(attacker) - 1;
  const target = attacker.leader || !frontline.length ? enemies[0] : frontline[lane % Math.min(frontline.length, 3)];
  const armed = !attacker.leader && team.equipment === 'blaster';
  const cadence = (!attacker.leader && team.equipment === 'eyes' ? 1.30 : 1) * (1 + active(team, 'haste'));
  attacker.lastHit = elapsed;
  const hesitation = team === enemy ? 1 + (1 - enemy.difficulty) * .38 : 1;
  attacker.nextHit = elapsed + ((attacker.leader ? .38 : .41) + Math.random() * .115) * hesitation / cadence;
  target.lastDamage = elapsed;
  let damage = attacker.leader ? 7.2 + team.growth * .55 : 2.1 + team.growth * .13;
  if (!attacker.leader && target.leader) {
    const attackers = living(team).filter(fighter => !fighter.leader).length;
    damage *= .42 / Math.max(1, Math.sqrt(attackers / 3));
  }
  if (!target.leader && targetTeam.equipment === 'shield') damage *= .65;
  damage *= (team.overdrive?.damage ?? 1) * (1 + active(team, 'rage')) * (1 - active(targetTeam, 'guard'));
  damage = Math.max(1, Math.round(damage + Math.random() * 1.6));
  if (attacker.leader && !target.leader) damage *= 3;
  const position = target.leader
    ? { x: 240 - targetTeam.facing * size(targetTeam) * .43, y: arenaY - 48 }
    : frontPosition(targetTeam, frontline.indexOf(target), frontline.length, 1, 1);
  const dealt = Math.min(target.hp, damage);
  target.hp -= dealt;
  attacker.hp = Math.min(attacker.maxHp, attacker.hp + Math.round(dealt * active(team, 'leech')));
  if (armed) attacker.shot = { x: position.x, y: position.y - (target.leader ? 0 : position.size * .43) };
  sound(armed ? 'shot' : 'bite', attacker.leader ? .77 : .49);
  if (attacker.leader && Math.random() < .19) sound('grunt', .68);
  if (target.hp === 0) sound('pop', target.leader ? .85 : .48);
  if (target.leader || target.hp === 0) {
    const color = team === player ? green : orange;
    burst(position.x, position.y, color, target.leader ? `−${damage}` : '', .49);
  }
}

function rivalSkillReady(id) {
  if (id === 'mend') {
    const wounded = living(enemy).find(fighter => fighter.hp < fighter.maxHp);
    return wounded && wounded.hp <= wounded.maxHp * .74;
  }
  if (id === 'guard') {
    const leader = enemy.fighters[0];
    return !active(enemy, 'guard') && (active(player, 'rage') || active(player, 'haste')
      || living(player).length > living(enemy).length || leader.hp <= leader.maxHp * .82);
  }
  return true;
}

function updateArena(dt) {
  const clash = elapsed >= impactTime;
  if (clash && elapsed >= impactTime + fightLimit) {
    if (fightEnded === null) finish(timeLimitResult(), true);
    else finish();
    return;
  }
  if (clash && fightEnded === null) {
    const seconds = Math.ceil(impactTime + fightLimit - elapsed);
    const clock = $('arenaClock');
    const label = `${seconds}s`;
    if (clock.textContent !== label) {
      clock.textContent = label;
      clock.dataset.urgent = String(seconds <= 8);
    }
    show('arenaClock', true);
  }
  const fightTitle = clash && elapsed < impactTime + .65;
  if (fightTitle && $('phase').hidden) {
    $('phase').textContent = 'FIGHT!';
    show('phase', true);
    burst(240, arenaY - 36, cream);
    sound('clash', .8);
    sound('grunt', .7);
  } else if (!fightTitle && !$('phase').hidden) show('phase', false);
  if (clash && fightEnded === null) {
    if (enemy.plan.length && elapsed >= enemy.plan[0].at) {
      const charge = enemy.plan.shift();
      const used = rivalSkillReady(charge.id) && useSkill(enemy, charge);
      const reaction = enemy.overdrive ? .28 : (1 - enemy.difficulty) * 1.50;
      const recovery = charge.id === 'mend' ? 5 : charge.id === 'guard' ? 1.1 : 0;
      charge.at = used ? charge.readyAt + reaction + recovery + Math.random() * .3 : elapsed + .65 + reaction * .5;
      enemy.plan.push(charge);
      enemy.plan.sort((a, b) => a.at - b.at);
    }
    // Resolve the earliest bite first without favoring either side on a low frame rate.
    const due = [];
    for (const [team, target] of [[player, enemy], [enemy, player]]) {
      const opposingMinis = living(target).some(fighter => !fighter.leader);
      const closingIn = !opposingMinis && team.equipment !== 'blaster';
      team.advance = clamp(team.advance + dt * (closingIn ? 3 : -3), 0, 1);
      for (const fighter of living(team)) {
        if (fighter.nextHit > elapsed) continue;
        if (closingIn && !fighter.leader && team.advance < .78) continue;
        due.push({ team, fighter, target });
      }
    }
    due.sort((a, b) => a.fighter.nextHit - b.fighter.nextHit);
    for (const { team, fighter, target } of due) if (fighter.hp > 0) attack(team, fighter, target);
    if (!living(player).length || !living(enemy).length) fightEnded = elapsed;
    updateHud();
  }
  updateControls();
  if (fightEnded !== null && elapsed - fightEnded > .8) finish();
}

function update(dt) {
  elapsed += dt;
  if (scene === 'match') {
    if (elapsed >= .75 && $('matchName').textContent !== rival) {
      $('matchStatus').textContent = enemy.overdrive ? `Opponent found · Overdrive ${enemy.overdrive.tier}` : 'Opponent found';
      $('matchName').textContent = rival;
      show('matchScore', true);
    }
    if (elapsed >= 1.95) startRun();
  } else if (scene === 'run') updateRun(dt);
  else if (scene === 'arena') updateArena(dt);
  if (scene === 'run' || scene === 'arena') {
    for (const effect of effects) effect.age += dt;
    effects = effects.filter(effect => effect.age < effect.duration);
  }
}

function ellipse(x, y, rx, ry, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function polygon(points, color) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (const [x, y] of points.slice(1)) ctx.lineTo(x, y);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawLandmarks(id, scroll) {
  const offset = scroll * .19;
  const start = Math.floor(offset / 103);
  for (let i = start - 2; i < start + 7; i++) {
    const x = i * 103 - offset;
    const j = .5 + .5 * Math.sin(i * 46.7);
    if (id === 'lava') {
      const y = 284 - j * 123;
      polygon([[x - 78, 391], [x - 25, y + 49], [x - 9, y], [x + 13, y + 8], [x + 33, y + 54], [x + 77, 391]], '#311b22');
      polygon([[x - 9, y], [x + 13, y + 8], [x + 22, y + 48], [x + 8, y + 28], [x + 3, y + 62], [x - 2, y + 24]], '#6e2d25');
      if (j > .58) polygon([[x - 4, y + 5], [x + 10, y + 11], [x + 13, y + 39], [x + 4, y + 23], [x + 2, y + 46]], '#c9542d');
    } else if (id === 'ice') {
      const y = 266 - j * 131;
      polygon([[x - 69, 398], [x - 9, y + 30], [x + 16, y], [x + 31, y + 52], [x + 80, 398]], '#7396b5');
      polygon([[x - 69, 398], [x - 9, y + 30], [x + 16, y], [x + 1, y + 120], [x + 13, 398]], '#ccebf3');
      polygon([[x - 13, y + 55], [x + 16, y], [x + 31, y + 52], [x + 13, y + 37]], '#eefbff');
    } else if (id === 'grass') {
      const y = 327 - j * 77;
      for (let k = 0; k < 3; k++) {
        const px = x + k * 27;
        const py = y + (k % 2) * 15;
        polygon([[px - 14, py + 73], [px - 7, py + 33], [px, py + 3], [px + 12, py + 43], [px + 18, py + 73]], '#507957');
        ctx.fillStyle = '#486b45';
        ctx.fillRect(px - 2, py + 58, 4, 23);
      }
    } else if (id === 'crystal') {
      const y = 71 + j * 77;
      polygon([[x - 70, 0], [x + 54, 0], [x + 23, y * .44], [x + 9, y], [x - 8, y * .53], [x - 38, y * .34]], '#1f1a37');
      const top = 288 - j * 96;
      polygon([[x - 22, 400], [x - 20, top + 24], [x + 2, top], [x + 18, top + 15], [x + 26, 398]], '#665296');
      polygon([[x - 20, top + 24], [x + 2, top], [x + 18, top + 15], [x + 2, top + 41]], '#af93df');
      polygon([[x + 2, top + 41], [x + 18, top + 15], [x + 26, 398], [x + 10, 398]], '#8970b1');
    }
  }
}

function landscape(scroll, arena = false, id = meta.appearance.arena) {
  const theme = environments[id];
  ctx.fillStyle = arena ? theme.duel : theme.sky;
  ctx.fillRect(0, 0, width, height);
  if (id !== 'classic') drawLandmarks(id, scroll);
  for (const [i, color] of theme.ridges.entries()) {
    const y = i ? 375 : 334;
    const parallax = i ? .25 : .13;
    const depth = i ? 31 : 34;
    ctx.beginPath();
    ctx.moveTo(0, height);
    for (let x = 0; x <= width; x += 8) {
      const px = x + scroll * parallax;
      ctx.lineTo(x, y + Math.sin(px / 76) * depth + Math.cos(px / 29) * depth * .35);
    }
    ctx.lineTo(width, height);
    ctx.fillStyle = color;
    ctx.fill();
  }
  const drift = reduceMotion ? 0 : visualTime * (id === 'lava' ? -11 : id === 'ice' ? 8 : 0);
  for (let i = 0; i < theme.particles; i++) {
    const x = ((i * 79 - scroll * .2 + drift * .37) % 500 + 500) % 500 - 10;
    const y = 26 + (((i * 173 + drift) % 550 + 550) % 550);
    ellipse(x, y, i % 5 === 0 ? 2.2 : .8, i % 5 === 0 ? 1.6 : .8, theme.dust[i % 2]);
  }
}

function traceGround(getY) {
  ctx.moveTo(0, getY(0));
  for (let x = 4; x <= width; x += 4) ctx.lineTo(x, getY(x));
}

function drawMagma(scroll) {
  const wave = reduceMotion ? 0 : visualTime * 2;
  for (const [i, color] of ['#69201e', '#a53722', '#e15020', '#ff8827'].entries()) {
    ctx.beginPath();
    ctx.moveTo(0, height);
    for (let x = 0; x <= width; x += 6) {
      const flow = (x + scroll * .8 + i * 22) / (29 - i * 4);
      ctx.lineTo(x, height - 97 + i * 19 + Math.sin(flow + wave) * (6 + i * 2)
        + Math.cos(flow * 1.46 - wave) * 3);
    }
    ctx.lineTo(width, height);
    ctx.fillStyle = color;
    ctx.fill();
  }
  ctx.strokeStyle = '#ffb544';
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 9; i++) {
    const x = ((i * 81 - scroll * .75) % 540 + 540) % 540 - 20;
    const y = height - 19 - i * 16 % 27 + Math.sin(wave + i) * 4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + 18, y - 6, x + 36, y - 1);
    ctx.stroke();
  }
}

function terrain(getY, scroll, id = meta.appearance.arena) {
  const theme = environments[id];
  ctx.beginPath();
  traceGround(getY);
  ctx.lineTo(width, height);
  ctx.lineTo(0, height);
  ctx.closePath();
  ctx.fillStyle = theme.ground;
  ctx.fill();
  if (id === 'lava') {
    ctx.save();
    ctx.clip();
    drawMagma(scroll);
    ctx.restore();
  }
  for (let i = Math.floor(scroll / 29); i < Math.floor(scroll / 29) + 18; i++) {
    const x = i * 29 - scroll;
    for (let j = 0; j < 3; j++) {
      const y = getY(clamp(x, 0, width)) + 21 + j * 56 + Math.abs(Math.sin(i * 51 + j)) * 32;
      const grain = theme.grain[j === 0 ? 0 : 1];
      if (id === 'ice' || id === 'crystal') {
        const lean = 7 + Math.abs(Math.cos(i)) * 10;
        polygon([[x - lean, y + 3], [x + 3, y - 6], [x + lean, y - 8], [x + 4, y + 3]], grain);
      } else ellipse(x + j * 10, y, 2 + Math.abs(Math.cos(i)) * 6, 1.8, grain);
    }
    if (id === 'grass' && i % 3 !== 0) {
      const y = getY(clamp(x, 0, width));
      polygon([[x - 7, y + 2], [x - 10, y - 7], [x - 2, y - 2], [x + 2, y - 13], [x + 5, y - 1], [x + 10, y - 6], [x + 9, y + 3]], '#82aa53');
    }
  }
  ctx.beginPath();
  traceGround(x => getY(x) + (id === 'classic' ? 6 : 7));
  ctx.strokeStyle = theme.trim;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  traceGround(getY);
  ctx.strokeStyle = theme.border;
  ctx.lineWidth = id === 'classic' ? 5.5 : 10;
  ctx.lineJoin = 'round';
  ctx.stroke();
  if (id !== 'classic') {
    ctx.strokeStyle = theme.edge;
    ctx.lineWidth = id === 'lava' ? 5.5 : 4.5;
    ctx.stroke();
  }
}

function slime(x, y, s, tint, facing = 1, open = 0, mood = 'focused', squash = 0, tilt = 0, gear = '', outline = '', appearance = null) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.scale(facing * s * (1 + squash * .16), s * (1 - squash * .19));
  ctx.beginPath();
  ctx.moveTo(-.51, -.12);
  ctx.bezierCurveTo(-.52, -.34, -.36, -.52, -.28, -.73);
  ctx.bezierCurveTo(-.22, -.9, -.09, -.94, .035, -.86);
  ctx.bezierCurveTo(.13, -.76, .23, -.68, .31, -.58);
  ctx.bezierCurveTo(.39, -.50, .56, -.51, .59, -.35);
  ctx.bezierCurveTo(.63, -.22, .55, -.1, .45, -.048);
  ctx.bezierCurveTo(.32, .036, -.46, .048, -.51, -.12);
  ctx.closePath();
  if (outline) {
    ctx.fillStyle = outline;
    ctx.strokeStyle = outline;
    ctx.lineWidth = .148;
    ctx.lineJoin = 'round';
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    return;
  }
  const jelly = ctx.createLinearGradient(-.18, -.88, .12, .04);
  jelly.addColorStop(0, cream);
  jelly.addColorStop(.44, tint);
  jelly.addColorStop(1, slimeShades[tint]);
  ctx.fillStyle = jelly;
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = .046;
  ctx.stroke();
  ellipse(-.25, -.60, .049, .085, '#ffffff61');
  ellipse(-.14, -.73, .028, .022, '#ffffff55');
  ellipse(-.31, -.32, .036, .020, '#30210e2b');

  const nervous = mood === 'nervous';
  const bored = mood === 'bored';
  const smug = mood === 'smug';
  const furious = mood === 'furious';
  const wild = mood === 'wild';
  const eyeY = nervous || wild ? -.69 : -.657;
  const eyeHeight = nervous || wild ? .165 : bored ? .075 : .123;
  ellipse(.122, eyeY, .17, eyeHeight + .024, ink);
  ellipse(.126, eyeY, .145, eyeHeight, cream);
  ctx.save();
  if (gear === 'eyes') {
    ctx.shadowColor = '#ff2525';
    ctx.shadowBlur = 8;
  }
  const irisX = wild ? .085 : nervous ? .14 : .19;
  const irisY = eyeY + (bored ? .013 : 0);
  const pupil = gear === 'eyes' ? '#ff3030' : appearance?.eyes === 'amber' ? '#c84d10' : ink;
  ellipse(irisX, irisY, nervous ? .05 : .071, eyeHeight * .79, pupil);
  if (gear !== 'eyes' && appearance?.eyes === 'star') drawSparkle(irisX, irisY, .063, '#ffc53e');
  ctx.restore();
  ellipse(nervous ? .15 : .212, eyeY - .025, .017, .016, '#fff');
  ctx.beginPath();
  ctx.moveTo(-.054, nervous ? -.835 : bored ? -.706 : smug ? -.748 : -.803);
  ctx.quadraticCurveTo(.087, nervous ? -.92 : wild ? -.90 : smug ? -.86 : -.754, .287, nervous || wild ? -.816 : bored ? -.712 : -.711);
  ctx.strokeStyle = ink;
  ctx.lineWidth = furious ? .09 : .069;
  ctx.stroke();
  if (nervous) {
    ctx.beginPath();
    ctx.moveTo(-.16, -.71);
    ctx.quadraticCurveTo(-.265, -.57, -.161, -.55);
    ctx.quadraticCurveTo(-.096, -.56, -.16, -.71);
    ctx.fillStyle = '#9ae9ff';
    ctx.fill();
  }

  const jaw = (bored ? .036 : nervous ? .06 : .073) + open * .23;
  const corner = smug ? -.44 : nervous ? -.352 : -.388;
  const roof = -.454 - jaw * .34;
  const floor = -.282 + jaw * .76;
  ctx.beginPath();
  ctx.moveTo(-.075, corner);
  ctx.bezierCurveTo(.09, roof - .044, .34, roof - .026, .51, roof + .025);
  ctx.bezierCurveTo(.59, roof + .068, .57, floor - .027, .34, floor);
  ctx.quadraticCurveTo(.035, floor + .016, -.075, corner);
  ctx.closePath();
  ctx.fillStyle = '#261a1d';
  ctx.fill();
  ctx.lineWidth = .028;
  ctx.stroke();
  ctx.save();
  ctx.clip();
  if (open > .35) ellipse(.30, floor + .02, .21, .085, '#cc5153');
  ctx.fillStyle = cream;
  for (let i = 0; i < (bored ? 3 : 5); i++) {
    const tx = -.009 + i * .108;
    const ty = mix(corner - .043, roof - .056, Math.min(1, .5 + i * .12));
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + .103, ty + .012);
    ctx.lineTo(tx + .065, ty + .128 + open * .023 + (i === 3 ? .028 : 0));
    ctx.fill();
  }
  for (let i = 0; i < 3; i++) {
    const tx = .15 + i * .11;
    const ty = floor + .031 - (i === 2 ? .022 : 0);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + .10, ty);
    ctx.lineTo(tx + .059, ty - .119);
    ctx.fill();
  }
  ctx.restore();
  if (appearance?.sparkle && appearance.sparkle !== 'none') {
    const sparkle = appearance.sparkle === 'ice' ? '#c7f8ff' : '#ffe761';
    const pulse = reduceMotion ? .83 : .78 + Math.sin(visualTime * 7 + x * .13) * .21;
    drawSparkle(-.425, -.54, .106 * pulse, sparkle, true);
    drawSparkle(-.11, -.88, .064 * pulse, sparkle, true);
  }
  ctx.restore();
}

function drawSparkle(x, y, radius, color, edge = false) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * i / 4;
    const r = radius * (i % 2 ? .34 : 1);
    ctx.lineTo(x + Math.cos(angle) * r, y + Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (edge) {
    ctx.lineWidth = .018;
    ctx.strokeStyle = ink;
    ctx.stroke();
  }
}

function orb(x, y, type) {
  const skill = skills[type];
  const special = equipment[type];
  const color = (skill ?? special)?.color ?? colors[type];
  ctx.save();
  if (skill) {
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    ctx.shadowColor = color;
    ctx.shadowBlur = 11;
    ctx.fillStyle = ink;
    ctx.fillRect(-14, -14, 28, 28);
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.fillRect(-11, -11, 22, 22);
    ctx.restore();
  } else {
    ctx.shadowColor = color;
    ctx.shadowBlur = special ? 16 : 9;
    if (special) ellipse(x, y, 21, 21, '#fff2cdbb');
    ellipse(x, y, 16, 17, ink);
    ellipse(x, y - 1, 13, 14, color);
    ctx.restore();
  }
  if (type === 'tail') {
    ellipse(x - 4, y + 3, 3.8, 3.8, ink);
    ellipse(x + 5, y + 3, 3.8, 3.8, ink);
    ellipse(x, y - 5, 3.8, 3.8, ink);
  } else {
    ctx.font = '900 22px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = ink;
    ctx.fillText((skill ?? special)?.icon ?? '+', x, y);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawPitMarkers(camera) {
  for (const pit of pits) {
    const x = pit.x - camera;
    if (x < -250 || x > width + 75) continue;
    const signX = x - 31;
    const y = ground(pit.x - 31);
    ctx.fillStyle = '#342e24';
    ctx.fillRect(signX - 2, y - 29, 4, 29);
    ctx.beginPath();
    ctx.moveTo(signX, y - 49);
    ctx.lineTo(signX + 16, y - 24);
    ctx.lineTo(signX - 16, y - 24);
    ctx.closePath();
    ctx.fillStyle = '#ffce4e';
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = ink;
    ctx.font = '900 17px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('!', signX, y - 27);
  }
}

function drawRunMinions(camera, chomp, outline = '') {
  const trail = Math.min(85, (player.tail - 1) * 21);
  for (let i = player.tail - 1; i >= 0; i--) {
    const x = distance - size(player) * .45 - 11 - i * trail / Math.max(1, player.tail - 1);
    const sample = followers.find(point => point.x >= x);
    const y = ground(x) - (sample?.lift ?? 0) * .8;
    slime(x - camera, y, 28, playerTint(), 1, chomp, 'focused', 0, grade(x) * .28, player.equipment, outline, meta.appearance);
    if (!outline) drawGear(x - camera, y, 28, 1, player.equipment);
  }
}

function drawRun() {
  const lead = 120 - (motion.vx - cruise) * .11;
  const camera = distance - lead;
  landscape(camera);
  terrain(x => ground(x + camera), camera);
  drawPitMarkers(camera);
  for (const item of boosters) {
    const x = item.x - camera;
    if (!item.eaten && x > -24 && x < width + 24) {
      const bob = reduceMotion ? 0 : Math.sin(visualTime * 5 + item.x) * 3;
      orb(x, ground(item.x) - item.elevation + bob, item.type);
    }
  }
  const chomp = Math.sin(bite / .4 * Math.PI);
  drawRunMinions(camera, chomp, playerOutline);
  drawRunMinions(camera, chomp);
  const trackY = ground(distance);
  const lift = trackY - motion.y;
  ellipse(lead, trackY + 1, size(player) * (.43 - Math.min(lift, 115) * .0014), 5, '#22201843');
  const wobble = reduceMotion ? 0 : Math.sin(distance * .065) * .12;
  const tilt = motion.airborne ? clamp(motion.vy / 970, -.25, .26) : Math.atan(grade(distance)) * .55;
  slime(lead, motion.y, size(player), playerTint(), 1, chomp, 'focused', motion.stretch + wobble, tilt, '', playerOutline);
  slime(lead, motion.y, size(player), playerTint(), 1, chomp, 'focused', motion.stretch + wobble, tilt, '', '', meta.appearance);
  drawEffects(camera);
}

function drawEffects(camera = 0) {
  for (const { x, y, color, label, age, duration, angle } of effects) {
    ctx.globalAlpha = 1 - age / duration;
    for (let i = 0; i < (label ? 6 : 5); i++) {
      const direction = angle + i * 1.26;
      ellipse(x - camera + Math.cos(direction) * (6 + age * 66), y + Math.sin(direction) * (3 + age * 53), 2.8, 2, color);
    }
    if (label) {
      const labelX = x - camera + (scene === 'run' && label === '+1' ? age * motion.vx * .68 : 0);
      const labelY = y - 10 - age * 58;
      ctx.font = '900 19px system-ui';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = ink;
      ctx.strokeText(label, labelX, labelY);
      ctx.fillStyle = color;
      ctx.fillText(label, labelX, labelY);
    }
    ctx.globalAlpha = 1;
  }
}

function biteAmount(fighter) {
  if (scene === 'result') return 0;
  const sinceHit = elapsed - fighter.lastHit;
  if (sinceHit < .078) return 1.48 * (1 - sinceHit / .078);
  const anticipation = fightEnded === null ? fighter.nextHit - elapsed : Infinity;
  return 1.48 * clamp(1 - anticipation / .106, 0, 1);
}

function frontPosition(team, index, count, entry, leap) {
  const rows = Math.min(count, Math.max(team.lineCount, Math.ceil(count / frontlineColumns)));
  const row = index % rows;
  const column = Math.floor(index / rows);
  const spacing = 23;
  const clash = 23 + column * spacing;
  const lastColumn = Math.ceil(count / rows) - 1;
  const stand = clash + Math.min(64, 210 - 23 - lastColumn * spacing);
  const advance = smooth(team.advance);
  const offset = mix(297 + column * spacing, mix(stand, clash, leap), entry);
  return { x: 240 - team.facing * (offset - advance * 45),
    y: arenaY + 65 + row * 35 - advance * 50, size: frontlineSize };
}

function arenaMotion(fighter, leap, fighting, phase = 0) {
  const mouth = fighting ? biteAmount(fighter) : leap > 0 ? 1.05 : 0;
  const time = elapsed + phase;
  const jitter = fighting && !reduceMotion ? Math.sin(time * 56) : 0;
  const recoil = fighting ? Math.max(0, 1 - (elapsed - fighter.lastDamage) / .13) : 0;
  const hop = fighting && !reduceMotion ? 3.9 * Math.max(0, Math.sin(time * 13)) ** 3 : 0;
  return { mouth, jitter, recoil, hop };
}

function drawLeader(team, start, stand, tint, time, entry, leap, fighting, outline = '') {
  const fighter = team.fighters[0];
  if (fighter.hp === 0) return;
  const facing = team.facing;
  const motion = arenaMotion(fighter, leap, fighting, facing);
  const grip = 240 - facing * size(team) * .49;
  const x = mix(mix(start, stand, entry), grip, leap) + facing * (motion.mouth * 3.5 - motion.recoil * 4) + motion.jitter;
  const lift = 71 * 4 * leap * (1 - leap);
  const idle = !reduceMotion && leap === 0 ? Math.sin(time * (fighter.mood === 'nervous' ? 18 : 5)) * .16 : 0;
  if (!outline && fighting && active(team, 'guard')) {
    ctx.beginPath();
    ctx.ellipse(x, arenaY - 36, size(team) * .69, size(team) * .59, -.24, 0, Math.PI * 2);
    ctx.fillStyle = '#76cbff28';
    ctx.fill();
    ctx.strokeStyle = '#4c9fff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  if (!outline) ellipse(x, arenaY + 2, size(team) * (.46 - lift * .002), 5, fighting && active(team, 'rage') ? '#ffc84d' : '#29231c54');
  slime(x, arenaY - lift - motion.hop, size(team), tint, facing, motion.mouth,
    leap > 0 ? 'furious' : fighter.mood, motion.mouth * .23 + motion.recoil * .50 + motion.jitter * .12 + idle,
    facing * (motion.mouth * .034 - motion.recoil * .055 + lift * .002), '', outline, fighter.appearance);
}

function drawGear(x, y, s, facing, gear, kick = 0) {
  if (gear !== 'shield' && gear !== 'blaster') return;
  ctx.save();
  ctx.translate(x + facing * s * .39, y - s * .29);
  ctx.scale(s * facing, s);
  ctx.lineWidth = .065;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = ink;
  if (gear === 'shield') {
    ctx.beginPath();
    ctx.moveTo(-.08, -.28);
    ctx.lineTo(.34, -.28);
    ctx.lineTo(.30, .06);
    ctx.quadraticCurveTo(.27, .23, .12, .31);
    ctx.quadraticCurveTo(-.05, .23, -.08, .07);
    ctx.closePath();
    ctx.fillStyle = '#91aebe';
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffedb0';
    ctx.fillRect(.088, -.221, .068, .325);
    ctx.fillRect(-.005, -.107, .26, .069);
  } else {
    ctx.translate(-kick * .14, 0);
    ctx.beginPath();
    ctx.moveTo(-.16, -.04);
    ctx.lineTo(-.08, -.16);
    ctx.lineTo(.23, -.15);
    ctx.lineTo(.23, -.10);
    ctx.lineTo(.49, -.10);
    ctx.lineTo(.49, .02);
    ctx.lineTo(.20, .02);
    ctx.lineTo(.13, .16);
    ctx.lineTo(.026, .16);
    ctx.lineTo(.055, .027);
    ctx.lineTo(-.16, .05);
    ctx.closePath();
    ctx.fillStyle = '#555460';
    ctx.fill();
    ctx.stroke();
    if (kick > .25) {
      ctx.fillStyle = '#ffdb61';
      ctx.beginPath();
      ctx.moveTo(.48, -.047);
      ctx.lineTo(.62, -.16);
      ctx.lineTo(.60, -.058);
      ctx.lineTo(.76, -.025);
      ctx.lineTo(.59, .019);
      ctx.lineTo(.61, .079);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawFrontline(team, tint, entry, leap, fighting, outline = '') {
  const minis = living(team).filter(fighter => !fighter.leader);
  for (let i = minis.length - 1; i >= 0; i--) {
    const fighter = minis[i];
    const pos = frontPosition(team, i, minis.length, entry, leap);
    const motion = arenaMotion(fighter, leap, fighting, i * .21 + team.facing);
    const armed = team.equipment === 'blaster';
    const mouth = armed ? 0 : motion.mouth;
    const lift = 32 * 4 * leap * (1 - leap) + motion.hop;
    const x = pos.x + team.facing * mouth * 1.05 + motion.jitter * .7;
    const s = pos.size;
    const y = pos.y - lift;
    if (!outline) ellipse(x, pos.y + 1, s * .43, 3.4, '#29231c64');
    const kick = armed && fighting ? clamp(1 - (elapsed - fighter.lastHit) / .105, 0, 1) : 0;
    slime(x, y, s, tint, team.facing, mouth, leap > 0 ? 'furious' : fighter.mood,
      mouth * .25 + motion.recoil * .52 + motion.jitter * .12, team.facing * motion.jitter * .043, team.equipment, outline, fighter.appearance);
    if (outline) continue;
    drawGear(x, y, s, team.facing, team.equipment, kick);
    if (kick > 0 && fighter.shot) {
      const travel = 1 - kick;
      const x1 = x + team.facing * s * .88;
      const y1 = y - s * .34;
      const tx = mix(x1, fighter.shot.x, travel);
      const ty = mix(y1, fighter.shot.y, travel);
      ctx.strokeStyle = '#ffe16b';
      ctx.lineWidth = 2.7;
      ctx.beginPath();
      ctx.moveTo(mix(x1, fighter.shot.x, Math.max(0, travel - .12)), mix(y1, fighter.shot.y, Math.max(0, travel - .12)));
      ctx.lineTo(tx, ty);
      ctx.stroke();
    }
    const barWidth = s * .82;
    const barY = y - s * 1.05 - 3;
    ctx.fillStyle = '#3c352e';
    ctx.fillRect(x - barWidth / 2, barY, barWidth, 5);
    ctx.fillStyle = fighting && active(team, 'guard') ? '#74c6ff' : fighter.lastDamage > elapsed - .09 && fighting ? cream : tint;
    ctx.fillRect(x - barWidth / 2 + 1, barY + 1, (barWidth - 2) * fighter.hp / fighter.maxHp, 3);
  }
}

function drawArena() {
  landscape(course - 120, true);
  terrain(() => arenaY, course);
  const time = scene === 'result' ? impactTime + 1 : elapsed;
  const entry = smooth(clamp(time / 1.52, 0, 1));
  const leap = clamp((time - approachTime) / (impactTime - approachTime), 0, 1);
  const fighting = scene === 'arena' && elapsed >= impactTime;
  drawLeader(player, -75, 109, playerTint(), time, entry, leap, fighting, playerOutline);
  drawLeader(enemy, 550, 371, enemy.tint, time, entry, leap, fighting, rivalOutline);
  drawLeader(player, -75, 109, playerTint(), time, entry, leap, fighting);
  drawLeader(enemy, 550, 371, enemy.tint, time, entry, leap, fighting);
  drawFrontline(player, playerTint(), entry, leap, fighting, playerOutline);
  drawFrontline(enemy, enemy.tint, entry, leap, fighting, rivalOutline);
  drawFrontline(player, playerTint(), entry, leap, fighting);
  drawFrontline(enemy, enemy.tint, entry, leap, fighting);
  if (scene === 'arena') drawEffects();
}

function drawIntro() {
  landscape(0, false, 'classic');
  terrain(x => 427 + Math.cos(x / 134) * 24, 0, 'classic');
  const wobble = reduceMotion ? 0 : Math.sin(visualTime * 4) * .17;
  if (scene === 'cover' || scene === 'meta') {
    orb(63, 337, 'growth');
    orb(416, 299, 'tail');
    slime(151, 418, 151, green, 1, .59, 'furious', wobble, 0, '', playerOutline);
    slime(330, 427, 142, orange, -1, .71, 'furious', -wobble, 0, '', rivalOutline);
    slime(151, 418, 151, playerTint(), 1, .59, 'furious', wobble, 0, '', '', meta.appearance);
    slime(330, 427, 142, orange, -1, .71, 'furious', -wobble);
  } else {
    slime(129, 419, 116, green, 1, .2, 'focused', wobble, 0, '', playerOutline);
    slime(129, 419, 116, playerTint(), 1, .2, 'focused', wobble, 0, '', '', meta.appearance);
    const revealed = elapsed >= .75;
    ctx.globalAlpha = revealed ? 1 : .24;
    if (revealed) slime(350, 424, 116, enemy.tint, -1, .1, enemy.mood, -wobble, 0, '', rivalOutline);
    slime(350, 424, 116, enemy.tint, -1, .1, enemy.mood, -wobble, 0, '', '', revealed ? enemy.appearance : null);
    ctx.globalAlpha = 1;
    ctx.fillStyle = ink;
    ctx.font = '900 33px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(revealed ? 'VS' : '?', 240, 362);
  }
}

function frame(now) {
  const dt = lastFrame ? Math.min((now - lastFrame) / 1000, .035) : 0;
  lastFrame = now;
  if (!paused) {
    visualTime += dt;
    update(dt);
  }
  if (scene === 'run') drawRun();
  else if (scene === 'arena' || scene === 'result') drawArena();
  else drawIntro();
  requestAnimationFrame(frame);
}

function arenaGradient(colors, top, spread = 1) {
  const gradient = ctx.createLinearGradient(0, top, 0, height);
  gradient.addColorStop(0, colors[0]);
  gradient.addColorStop(spread, colors[1]);
  return gradient;
}

const environments = {
  classic: {
    skyColors: ['#c6c0b4', '#aea99d'], duelColors: ['#c7b7a8', '#aa9f92'], groundColors: ['#aaa396', '#8d8577'],
    ridges: ['#9a968b32', '#77746828'], dust: ['#fff4de4a', '#665b4d22'], particles: 115,
    grain: ['#554b3d45', '#efe2cc36'], trim: '#efe2c478', edge: ink, border: ink,
  },
  lava: {
    skyColors: ['#22151e', '#673022'], duelColors: ['#20141a', '#792e22'], groundColors: ['#3d2528', '#24191d'],
    ridges: ['#4b2324bb', '#372024e8'], dust: ['#feab526e', '#ff6d3998'], particles: 53,
    grain: ['#c44c2c5e', '#843d405c'], trim: '#b34721', edge: '#ff831e', border: '#23141a',
  },
  ice: {
    skyColors: ['#cde8fa', '#8db4cc'], duelColors: ['#c7edfa', '#8ca7c2'], groundColors: ['#5f8bac', '#355c7d'],
    ridges: ['#9ab9dabb', '#a6cde4d6'], dust: ['#faffffc9', '#e2ffff83'], particles: 70,
    grain: ['#d4fbff8a', '#a6dbef63'], trim: '#6dc1e1', edge: '#e0faff', border: '#264963',
  },
  grass: {
    skyColors: ['#d4e5ad', '#aecb92'], duelColors: ['#d4e5ad', '#9abe80'], groundColors: ['#627741', '#35482f'],
    ridges: ['#7ea3659e', '#739453b9'], dust: ['#f2ecc477', '#759f5677'], particles: 48,
    grain: ['#abc06c99', '#31492b8c'], trim: '#779453', edge: '#d4f098', border: '#293b24',
  },
  crystal: {
    skyColors: ['#251d3b', '#564171'], duelColors: ['#242041', '#614590'], groundColors: ['#493460', '#2a2242'],
    ridges: ['#422e57a8', '#332649d6'], dust: ['#cfb4ff8c', '#8c68cd8c'], particles: 56,
    grain: ['#b590f488', '#6f529d7d'], trim: '#8966bb', edge: '#e0baff', border: '#281c3c',
  },
};
for (const [id, theme] of Object.entries(environments)) {
  theme.sky = arenaGradient(theme.skyColors, 0, id === 'classic' ? .63 : .87);
  theme.duel = arenaGradient(theme.duelColors, 0, id === 'classic' ? .7 : .87);
  theme.ground = arenaGradient(theme.groundColors, 322);
}

$('fight').addEventListener('click', beginMatch);
$('progress').addEventListener('click', () => openMeta('progress'));
$('customize').addEventListener('click', () => openMeta('customize'));
$('skillLab').addEventListener('click', () => openMeta('lab'));
$('metaBack').addEventListener('click', exitToMenu);
$('again').addEventListener('click', beginMatch);
$('resultMenu').addEventListener('click', exitToMenu);
$('newFight').addEventListener('click', beginMatch);
$('exit').addEventListener('click', exitToMenu);
$('jump').addEventListener('click', jump);
$('settings').addEventListener('click', toggleSettings);
$('resume').addEventListener('click', toggleSettings);
$('mute').textContent = muted ? 'Sound: Off' : 'Sound: On';
$('mute').addEventListener('click', toggleSound);
for (let i = 0; i < 4; i++) $(`skill${i + 1}`).addEventListener('click', () => useSlot(i));
window.addEventListener('keydown', event => {
  if (event.code === 'Escape' && !event.repeat) toggleSettings();
  if (paused && event.code === 'Tab') {
    const first = $('resume');
    const last = $('exit');
    if ((event.shiftKey && event.target === first) || (!event.shiftKey && event.target === last)) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus();
    }
  }
  if (paused || event.repeat) return;
  if (scene === 'run' && ['Space', 'ArrowUp'].includes(event.code)) {
    if (event.code === 'Space' && event.target === $('settings')) return;
    event.preventDefault();
    jump();
  } else if (scene === 'arena' && /^[1-4]$/.test(event.key)) {
    useSlot(Number(event.key) - 1);
  }
});
updateHome();
// Mobile Safari suspends animation frames while the page is in the background.
// Reset the frame clock on return so the simulation never receives a huge time step.
document.addEventListener('visibilitychange', () => {
  lastFrame = 0;
  if (document.hidden && audio && audio.state === 'running') {
    audio.suspend().catch(() => {});
  }
});
window.addEventListener('pageshow', () => { lastFrame = 0; });
requestAnimationFrame(frame);
</script>
